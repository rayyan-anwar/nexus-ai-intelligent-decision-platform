# Local stack: PostgreSQL + API + web UI.
#   cp .env.example .env   (edit the placeholders)
#   docker compose -f deployment/docker-compose.yml --env-file .env up --build
# The UI is served on http://127.0.0.1:8080 ; the API and database are not published to the host.
name: nexus-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-development}
      NEXUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexus}
      NEXUS_DATA_DIR: /data
      NEXUS_API_TOKEN_HASHES: ${NEXUS_API_TOKEN_HASHES:-}
      NEXUS_ADMIN_TOKEN_HASHES: ${NEXUS_ADMIN_TOKEN_HASHES:-}
      NEXUS_CORS_ORIGINS: ${NEXUS_CORS_ORIGINS:-http://127.0.0.1:8080}
      NEXUS_RETENTION_DAYS: ${NEXUS_RETENTION_DAYS:-30}
      NEXUS_TRUST_PROXY_HEADERS: "true"
    volumes:
      - nexus_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  nexus_data:
