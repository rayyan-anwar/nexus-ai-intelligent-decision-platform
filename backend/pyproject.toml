[project]
name = "nexus-ai-backend"
version = "0.1.0"
description = "NEXUS AI backend: tabular ML, explanations, anomaly and drift analysis behind a FastAPI service."
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]
authors = [{ name = "Rayyan Anwar" }]
license = { text = "MIT" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = [
  "E501",   # long lines are handled by the formatter where practical
  "S101",   # asserts are used in tests
  "B008",   # FastAPI Depends()/File() defaults
  "S608",   # SQL is only ever parameterised (see docs/security.md)
  "B905",   # zip() without strict=: lengths are equal by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S607", "E402"]
"app/ml/synthetic.py" = ["S311"]
"app/ml/tracking.py" = ["S301"]   # joblib.load is guarded by a checksum; see load_bundle()
